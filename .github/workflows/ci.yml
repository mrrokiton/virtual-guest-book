name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    env:
      NODE_ENV: production
      APP_URL: http://localhost:3000
      DATABASE_URL: postgres://vgb:vgb@localhost:5432/vgb
      BETTER_AUTH_SECRET: ci-better-auth-secret-at-least-32-chars
      GUEST_SESSION_SECRET: ci-guest-session-secret-at-least-32-chars
      PIN_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: vgb-media
      S3_ACCESS_KEY_ID: vgb-minio
      S3_SECRET_ACCESS_KEY: vgb-minio-secret
      S3_FORCE_PATH_STYLE: 'true'
      VIDEO_PROVIDER: local
      SMTP_URL: smtp://localhost:1025
      MAILPIT_URL: http://localhost:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: docker compose up -d --wait postgres minio mailpit && docker compose run --rm minio-setup
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm build
      - run: pnpm --filter @vgb/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
