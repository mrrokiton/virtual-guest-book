# Deploy from the repository root, BEFORE the web app (it applies database migrations):
#   fly deploy . --config apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
app = "vgb-worker"
primary_region = "fra"
kill_signal = "SIGTERM"
kill_timeout = 75

[env]
  NODE_ENV = "production"
  VIDEO_PROVIDER = "cloudflare"
  S3_REGION = "auto"
  S3_FORCE_PATH_STYLE = "true"
  # Exit 0 when idle. Requires restart policy on-failure (a clean exit stays stopped) and
  # FLY_API_TOKEN on vgb-web, which starts this machine again. Deploy web first.
  WORKER_EXIT_WHEN_IDLE = "true"

[[restart]]
  policy = "on-failure"
  max_retries = 10

[deploy]
  release_command = "node_modules/.bin/tsx ../../packages/db/src/migrate-cli.ts"
  # Let active photo/ZIP jobs finish (the worker stops gracefully on SIGTERM, up to 60 s).
  strategy = "rolling"

[processes]
  worker = "node_modules/.bin/tsx src/index.ts"

[[vm]]
  # sharp + HEIC decoding of 48 MP phone photos needs headroom.
  size = "shared-cpu-2x"
  memory = "1gb"
  processes = ["worker"]
