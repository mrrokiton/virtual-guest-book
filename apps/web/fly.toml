# Deploy from the repository root:
#   fly deploy . --config apps/web/fly.toml --dockerfile apps/web/Dockerfile
app = "vgb-web"
primary_region = "fra"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  VIDEO_PROVIDER = "cloudflare"
  S3_REGION = "auto"
  S3_FORCE_PATH_STYLE = "false"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # Keep one machine warm: guests arrive in bursts right after the QR code goes up.
  min_machines_running = 1

  # Every open gallery holds one SSE connection, so limit by connections, not requests.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 800
    hard_limit = 1000

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
